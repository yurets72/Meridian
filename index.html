<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Таверна — вид от первого лица</title>
<style>
:root{--bg:#e8dcc3;--ink:#2a1a0f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0a07;--ink:#ecdcb8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0a07;--ink:#ecdcb8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Verdana,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:10px}
.game{background:repeating-linear-gradient(90deg,#b07028 0 6px,#a5652a 6px 8px);border:3px solid #5a3a14;padding:8px;box-shadow:0 10px 30px #0006}
.tb{display:flex;gap:6px;margin-bottom:8px}
.tb button{width:40px;height:36px;font-size:18px;background:#c98b3a;border:2px outset #e4b46a;cursor:pointer}
.mid{display:grid;grid-template-columns:1fr 210px;gap:8px}
@media(max-width:700px){.mid{grid-template-columns:1fr}}
.vp{position:relative;border:3px solid #e8c820;aspect-ratio:4/3;background:#000;overflow:hidden;touch-action:none}
#gl{width:100%;height:100%;display:block;image-rendering:pixelated}
#lab{position:absolute;color:#fff;font-size:15px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;pointer-events:none;transform:translate(-50%,-100%);display:none}
.side{background:#a0652a;border:2px inset #7a4a1a;padding:8px;color:#fff;font-size:13px}
.pl{display:flex;gap:8px;align-items:flex-start}
#face{width:56px;height:64px;image-rendering:pixelated;border:2px solid #5a3a14}
.bars{flex:1}
.b{height:14px;background:#000;border:1px solid #ddd;margin-bottom:6px;position:relative}
.b i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#3a5ae0,#1a2a9a)}
.b span{position:absolute;right:3px;top:-1px;font-size:11px;color:#fff}
.inv{background:#8a5524;border:2px inset #6a4018;height:92px;margin:8px 0;font-size:26px;padding:6px}
.sb{display:flex;gap:4px;justify-content:center}
.sb button{background:#3a52b0;color:#fff;border:2px outset #7a92f0;font-size:13px;padding:2px 6px;cursor:pointer}
.chat{margin-top:8px;background:#cfa96a;border:2px inset #8a6a30;color:#000}
#log{height:116px;overflow:auto;padding:4px 6px;font-size:14px;line-height:1.35}
#log p{margin:0}
.pu{color:#a020a0}.mg{color:#c0209a}
#cmd{width:100%;box-sizing:border-box;border:1px solid #6a4a1a;background:#fff;padding:4px;font:inherit}
.pad{display:flex;gap:6px;justify-content:center;margin-top:6px}
.pad button{width:54px;height:36px;font-size:18px;background:#c98b3a;border:2px outset #e4b46a;cursor:pointer;touch-action:none}
.note{font-size:13px;margin:10px 2px 0;opacity:.8}
</style>
</head>
<body>
<div class="wrap">
<div class="game">
  <div class="tb"><button title="Справка" onclick="help()">❓</button><button title="Взять">🖐</button><button title="Отдать">✋</button><button title="Магия">🪄</button><button title="Свиток">📜</button><button title="Герой">🧍</button></div>
  <div class="mid">
    <div>
      <div class="vp" id="vp"><canvas id="gl"></canvas><div id="lab"></div></div>
      <div class="pad"><button data-k="ArrowLeft">◀</button><button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div>
    </div>
    <div class="side">
      <div class="pl"><canvas id="face" width="28" height="32"></canvas>
        <div class="bars"><div class="b"><i style="width:30%"></i><span>20</span></div><div class="b"><i style="width:30%"></i><span>20</span></div><div class="b"><i style="width:92%"></i><span>98</span></div></div></div>
      <div class="inv">🍄 🗡️ 👖</div>
      <div class="sb"><button>Статы</button><button>Заклинания</button><button>Навыки</button></div>
    </div>
  </div>
  <div class="chat"><div id="log"></div><input id="cmd" placeholder="Введите команду или фразу и нажмите Enter" autocomplete="off"></div>
</div>
<p class="note">Управление: стрелки или WASD — идти и поворачиваться, Q/E — шаг в сторону. Наведите курсор на персонажа, кликните — он ответит. Графика нарисована заново в духе оригинала.</p>
</div>
